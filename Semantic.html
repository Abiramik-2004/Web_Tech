<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantic Tags in HTML</title>
    
</head>
<body>
    <nav>
        <h2>MyLogo</h2>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>Contact</li>
        </ul>
    </nav>
    <header>
        <h1>Welcome to Semantic Page</h1>
        <p>You will be learning Semantic tag here </p>
        <button>Get Started</button>
    </header>
    <main>
        <figure>
            <img src="in.jpg.jfif" alt="" srcset="">
            <figcaption>girl image</figcaption>
        </figure>

    </main>
    <section>
        <aside><b>I am Left</b></aside>
        <aside><b>I am Right</b></aside>
    </section>
    <article>
        <details>
            <summary>HTML</summary>
            <p>It is stand for HyperText markup language</p>
        </details>
    </article>
    <footer>Semantic tag  footer</footer>
</body>
</html>
