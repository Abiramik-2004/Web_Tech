<html>
    <head>
        <h3>Student Form</h3>
    </head>
    <body>
        <fieldset>
            <legend>Student information</legend>
            <br>
            <label for="sname"><b>Student Name</b></label>
            <input type="text" name="name" id="sname" placeholder="Enter your name" required><br><br>
            <label for="sage"><b>Student age</b></label>
            <input type="number" name="age" id="sage" placeholder="Student age"><br><br>
            <label for="Semail"><b>Email</b></label>
            <input type="email" name="semail" id="Semail" placeholder="Enter the email id"><br><br>
            <label for="sub"><b>Subject</b></label><br>
            <input type="checkbox" id="sub1" >
            <label for="sub1">SQL</label>
            <input type="checkbox" id="sub2">
            <label for="sub2">JAVA</label>
            <input type="checkbox" id="sub3">
            <label for="sub3">WebTech</label><br><br>
            <label for=""><b>Gender</b></label><br>
            <input type="radio" name="subj" id="gen1" value="Male">
            <label for="gen1">Male</label>
            <input type="radio" name="subj" id="gen2" value="female">
            <label for="gen2">Female</label>
            <input type="radio" name="subj" id="gen3" value="Other">
            <label for="gen3">Other</label><br><br>
            <label for="dob"><b>Date of Birth</b></label><br>
            <input type="date" id="dob"><br><br>
            <label for="addrs"><b>Your Address</b></label><br>
            <textarea name="address" id="addrs" cols="30" rows="10"></textarea><br><br>
            <label for="crs"><b>Select course</b></label>
            <select name="" id="crs" >
                <option value="bck">Backend developer</option>
                <option value="frn">Frontend Developer</option>
                <option value="full">Full-stack developer</option>
                
            </select>
            <br><br>
            <button><b>Register</b></button>
        </fieldset>
    </body>
</html>
